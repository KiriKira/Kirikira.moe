# Sveltia CMS — https://sveltiacms.app/en/docs
# Open https://kirikira.moe/admin/ , sign in with a GitHub personal access token
# (fine-grained, this repo only, Contents: read & write). Every save is a commit to
# `migration-preview` (preview build only — revert to `main` before going live).
backend:
  name: github
  repo: KiriKira/Kirikira.moe
  branch: migration-preview
  commit_messages:
    create: 'post: add “{{slug}}”'
    update: 'post: update “{{slug}}”'
    delete: 'post: delete “{{slug}}”'
    uploadMedia: 'media: upload “{{path}}”'
    deleteMedia: 'media: delete “{{path}}”'

site_url: https://kirikira.moe
display_url: https://kirikira.moe

# Small images can live in the repo (public/uploads), but put photos and every
# video/audio file in Cloudflare R2 (served from media.kirikira.moe): it keeps the git
# repo small and Workers static assets cap single files at 25 MiB.
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  cloudflare_r2:
    # Fill these in after creating the bucket (docs/MIGRATION_RUNBOOK.md §7). The R2
    # *secret* key never goes here: Sveltia asks for it once and keeps it in your browser.
    access_key_id: REPLACE_WITH_R2_ACCESS_KEY_ID
    account_id: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
    bucket: kirikira-media
    public_url: https://media.kirikira.moe
  default:
    config:
      max_file_size: 5000000 # 5 MB; anything bigger belongs in R2
  all:
    filename_template: '{{year}}{{month}}-{{filename}}-{{uuid_short}}'
    # Photos are converted to WebP and capped at 2400px in the browser before upload.
    transformations:
      raster_image: { format: webp, quality: 85, width: 2400, height: 2400 }

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    description: 新建文章时「文件名」填文章序号（当前最大 54，下一篇 55）。地址就是 /post/序号/，发布后不能再改。
    slug:
      editable: [create]
    identifier_field: title
    summary: '{{title}}'
    # Table view columns (large screens): summary = title, plus date / category / draft.
    table_columns:
      - _summary
      - date
      - category
      - draft
    sortable_fields:
      fields: [date, title, category]
      default: { field: date, direction: descending }
    view_filters:
      - { label: 草稿, field: draft, pattern: true }
    preview_path: 'post/{{slug}}/'
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 发布时间, widget: datetime, input_timezone: 'Asia/Shanghai', output_utc: true, default: '{{now}}' }
      - { name: updated, label: 更新时间, widget: datetime, required: false, auto_now: true, input_timezone: 'Asia/Shanghai', output_utc: true, hint: 保存时自动写入当前时间，不用手填 }
      - name: category
        label: 分类
        widget: select
        options: ['碎碎念', '无情安利', '流下了没有技术的泪水', 'BABU']
        default: 碎碎念
        hint: 要加新分类，改 public/admin/config.yml 的 options（或少见情况告诉 Hermes）
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: excerpt, label: 摘要, widget: text, required: false, hint: 首页列表与 RSS 中显示 }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 草稿不会出现在线上站点 }
      - name: music
        label: 背景音乐（APlayer）
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: title, label: 曲名, widget: string }
          - { name: author, label: 歌手, widget: string, required: false }
          - { name: url, label: 音频 URL, widget: string }
          - { name: pic, label: 封面 URL, widget: string, required: false }
      - name: body
        label: 正文
        widget: markdown
        hint: >-
          图片：直接粘贴/拖进来，单独一行会按横竖自动排版、可点击放大；多张图片相邻行不空行 = 左右滑动的图集。
          视频、B站/YouTube/网易云：用工具栏的「视频」「嵌入」按钮（也可手写：视频写成 ![说明](xxx.mp4)，嵌入就是单独一行贴链接）。
      # Comment thread id. Generated once; never edit (it links the post to its comments).
      - { name: cid, label: 评论 ID, widget: uuid, read_only: true, required: false }
      - { name: legacyId, label: 旧站文章 ID, widget: number, value_type: int, required: false, hint: 迁移数据，勿改 }
