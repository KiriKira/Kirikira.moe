# Build and deploy on every push, from GitHub Actions instead of Cloudflare Workers Builds:
# the full log is in the run, nothing is cached between runs (a fresh `npm ci` + build every
# time), and a failure can't go unnoticed:
#   - the commit gets a red ✗ (and GitHub emails whoever pushed, per their notification settings);
#   - an issue labelled `deploy-failed` is opened (GitHub notifies the repo's watchers), and
#     closed automatically by the next successful deploy;
#   - a Telegram message, if TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are set (same as the watchdog).
#
# scripts/deploy.mjs does the deploying: D1 migrations, upload a new version WITHOUT traffic,
# smoke-test it, promote, smoke-test the live URL, roll back on failure. Production only ever
# runs a version that was seen working; a failed run leaves the previous version live.
#
# Setup (repo Settings -> Secrets and variables -> Actions), see docs/MIGRATION_RUNBOOK.md 6.2:
#   secret   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, D1:Edit, Account Settings:Read
#   secret   CLOUDFLARE_ACCOUNT_ID  the account id (dashboard sidebar)
#   variable SITE_URL               optional: the live URL to verify (default: the workers.dev URL)
#   variable DEPLOY_MASTER          set to "true" when master becomes production (until then
#                                   only migration-preview deploys)
# And turn OFF Cloudflare Workers Builds for the Worker, or both would deploy every push.
name: Deploy

on:
  push:
    branches: [migration-preview, master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'legacy/**'
      - '.github/workflows/watchdog.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One deploy per branch at a time. A newer push waits for the running deploy (never cancel a
# deploy halfway); if several pushes pile up, only the newest waiting one runs.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# Explicit bash = `bash -eo pipefail`: without it a failing `npm run build | tee` would pass.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref_name == 'migration-preview' || (github.ref_name == 'master' && vars.DEPLOY_MASTER == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build 2>&1 | tee build.log

      - name: Deploy (gated, with smoke tests and rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (Settings -> Secrets and variables -> Actions)." | tee deploy.log
            exit 1
          fi
          # An empty variable would confuse wrangler; leave it unset so it finds the account itself.
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          node scripts/deploy.mjs 2>&1 | tee deploy.log

      - name: Report (issue + Telegram)
        if: always() && (success() || failure())
        id: report
        uses: actions/github-script@v7
        env:
          OK: ${{ job.status == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.OK === 'true';
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `❌ Deploy of ${branch} failed`;
            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: 'deploy-failed', state: 'open' }))
              .data.find((i) => i.title === title);
            const tail = ['deploy.log', 'build.log']
              .filter((f) => fs.existsSync(f))
              .map((f) => fs.readFileSync(f, 'utf8'))
              .find(Boolean)?.slice(-3500) ?? '(failed before the build: see the run log)';
            const commit = `${context.payload.head_commit?.message?.split('\n')[0] ?? ''} (${sha})`;
            let change = '';
            if (!ok && !open) {
              await github.rest.issues.create({
                owner, repo, title, labels: ['deploy-failed'],
                body: `Commit: ${commit}\n[Run log](${run})\n\nThe site was **not** updated; the previous version is still live.\n\n\`\`\`\n${tail}\n\`\`\`\nSee docs/MIGRATION_RUNBOOK.md 6.2.`,
              });
              change = 'failed';
            } else if (!ok && open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Failed again: ${commit} · [run](${run})\n\n\`\`\`\n${tail.slice(-1500)}\n\`\`\`` });
            } else if (ok && open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `✅ Deployed ${commit} · [run](${run})` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              change = 'recovered';
            }
            core.setOutput('change', change);
            core.setOutput('text', ok ? `✅ ${branch} deploys again: ${commit}` : `❌ Deploy of ${branch} failed: ${commit}\n${run}`);

      - name: Telegram (only when the state changes)
        if: always() && steps.report.outputs.change != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ steps.report.outputs.text }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$TEXT" > /dev/null
