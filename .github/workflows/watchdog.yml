# Uptime watchdog for the live site, deliberately running OUTSIDE Cloudflare: if the
# Worker breaks (e.g. "error code: 1101" on every route), a check living on the same
# platform could break with it.
#
# Every 10 minutes: scripts/smoke.mjs --quick (static asset, home page, a post, the
# comments API). Two failures 60s apart -> opens an issue labelled `site-down` (GitHub
# notifies you by email/app) and, if configured, sends a Telegram message. When the site
# is healthy again the issue is closed with a note.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   variable WATCHDOG_URL        e.g. https://kirikira.moe  (unset = watchdog off)
#   secret   TELEGRAM_BOT_TOKEN  optional
#   secret   TELEGRAM_CHAT_ID    optional
# Scheduled workflows only run from the default branch, and GitHub pauses them after
# 60 days without repository activity (it emails you first).
name: Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    if: vars.WATCHDOG_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke test (retry once after 60s)
        id: smoke
        env:
          URL: ${{ vars.WATCHDOG_URL }}
        run: |
          if node scripts/smoke.mjs "$URL" --quick > out.txt 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; cat out.txt; exit 0; fi
          cat out.txt; sleep 60
          if node scripts/smoke.mjs "$URL" --quick > out.txt 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat out.txt
      - name: Open / update / close the site-down issue
        id: issue
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.smoke.outputs.ok }}
          URL: ${{ vars.WATCHDOG_URL }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.OK === 'true';
            const out = fs.readFileSync('out.txt', 'utf8').slice(-3000);
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: 'site-down', state: 'open' })).data[0];
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let change = '';
            if (!ok && !open) {
              await github.rest.issues.create({
                owner, repo, labels: ['site-down'],
                title: `🚨 ${process.env.URL} is down`,
                body: `The watchdog failed twice in a row.\n\n\`\`\`\n${out}\n\`\`\`\n[Run](${run}) · See docs/MIGRATION_RUNBOOK.md「事故处理」.`,
              });
              change = 'down';
            } else if (!ok && open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Still failing ([run](${run})).` });
            } else if (ok && open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `✅ Recovered ([run](${run})).` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              change = 'up';
            }
            core.setOutput('change', change);
      - name: Telegram (only when the state changes)
        if: steps.issue.outputs.change != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANGE: ${{ steps.issue.outputs.change }}
          URL: ${{ vars.WATCHDOG_URL }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          if [ "$CHANGE" = down ]; then TEXT="🚨 $URL is DOWN (watchdog failed twice). See GitHub issues."; else TEXT="✅ $URL recovered."; fi
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$TEXT" > /dev/null
      - name: Fail the run while the site is down
        if: steps.smoke.outputs.ok != 'true'
        run: exit 1
